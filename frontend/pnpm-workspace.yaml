packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 默认不执行依赖的构建脚本。下面这些必须放行，否则装不完整：
# - esbuild：Vite 的转译器，需要它的原生二进制
# 桌面壳用 Tauri：它不下载运行时（用系统 WebView2），Rust 侧的构建由 cargo 自己完成，
# 因此这里不再需要放行任何 electron* 包。
minimumReleaseAgeExclude:
  - vite@8.3.4
  - lucide-react@1.54.0

allowBuilds:
  # 清单漏了 esbuild 时 pnpm 不装它的原生二进制，而这一步是静默跳过的——
  # 只有到 Vite 构建时才炸。
  esbuild: true
