spring:
  datasource:
    # 默认指向本机 3307 的 SSH 隧道（服务器上的 paideia_test）。凭据只从环境变量读取。
    #
    # **`forceConnectionTimeZoneToSession=true` 不能删**（2026-10-10 实测补上）：服务器 MySQL 的
    # 会话时区是 `SYSTEM`（+08:00）且没有装载时区表（`SET time_zone='UTC'` 直接报 1298），
    # 只写 `connectionTimeZone=UTC` 是"驱动以为会话是 UTC、会话其实是 +08:00"——
    # 于是建表默认值 `CURRENT_TIMESTAMP(3)` 写进去的是**本地钟点**，驱动又按 UTC 转成 `Instant`，
    # 接口返回的时间就比真实时刻快 8 小时。加上它之后驱动会把会话也设成 UTC（它会自己折算成
    # `+00:00` 的偏移形式，所以没有时区表也能用）。
    url: ${PAIDEIA_TEST_DB_URL:jdbc:mysql://127.0.0.1:3307/paideia_test?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
    username: ${PAIDEIA_TEST_DB_USER:paideia}
    password: ${PAIDEIA_TEST_DB_PASSWORD:}
    hikari:
      # **每个 Spring 上下文各有一个连接池**，而 Spring 的测试上下文缓存会同时保留多个
      # （配置键不同的测试类各起一个）。Hikari 默认 maximum-pool-size=10 且 minimum-idle
      # 等于它，也就是**每个上下文一启动就预建 10 个连接**——本模块有 40 多个
      # @SpringBootTest，15 个上下文就把 MySQL 的 max_connections=151 占满，
      # 表现为后面的测试类报 "Too many connections"（2026-10-23 实测，全量跑必红）。
      # 测试是串行执行的（surefire forkCount=1），2 个连接绰绰有余。
      maximum-pool-size: 2
      minimum-idle: 1
      # 连接被 MySQL 主动掐断时（wait_timeout）不要立刻失败重试到上限
      connection-timeout: 10000
  flyway:
    # 生产迁移 + 测试夹具表 + 开发种子（seed-learner / seed-admin 与知识库种子）。
    #
    # **所有集成测试需要的数据源都列在这里，测试类不许用 @SpringBootTest(properties=…) 覆盖它。**
    # 原因：Spring 的测试上下文缓存按"配置键"区分，只要有一个类多覆盖一个键，它就和其它测试
    # **各起一个上下文**——每个上下文要起一次 Spring + 让 Flyway 连远程 MySQL，实测 15–25 秒。
    # 宁可这里多列一行，也不要在测试类里制造第二条上下文。
    locations: classpath:db/migration,classpath:db/testdata,classpath:db/devdata
    # 必须放开乱序，原因是两套编号规则的结构性冲突：
    # 夹具用 V900+ 编号（刻意排在所有生产迁移之后），生产迁移从 V1 开始。
    # 于是"夹具已应用、之后新增一个更低版本的生产迁移"在 Flyway 眼里就是乱序，
    # validateOnMigrate 会直接拒绝并让整个测试上下文起不来——**每加一个生产迁移都会复发**。
    # 只在测试 profile 放开；生产迁移自身仍按版本顺序演进，不因此变得随意。
    out-of-order: true
    # paideia_test 这个库被**三种迁移配置**共用：
    #   ① 本 profile：db/migration + db/testdata
    #   ② 端到端测试的后端：db/migration + db/devdata
    #   ③ paideia-persistence 的集成测试：只有 db/testdata
    # 于是历史表里会出现"本方 locations 解析不到的已应用版本"，按方向分成两种：
    #   *:future  —— 已应用版本高于本方解析出的最高版本（例：e2e 的 V950 之于本 profile 的 V900）
    #   *:missing —— 已应用版本在本方解析不到且不高于最高版本（例：夹具 V900 之于 e2e 的 V950）
    # 两个方向都要忽略；不忽略的话，任何一方跑过之后另一方都起不来。
    # 生产不受影响：那边的 locations 只有 db/migration，不存在别人的版本。
    ignore-migration-patterns:
      - '*:future'
      - '*:missing'

paideia:
  auth:
    # 测试专用密钥。只用于测试；任何真实环境都必须通过 PAIDEIA_AUTH_SECRET 提供自己的密钥。
    secret: test-only-secret-do-not-reuse-in-any-real-environment-0123456789
    issuer: paideia-test
    token-ttl: 30m
  knowledge:
    # 集成测试会真的往这个目录写附件。放临时目录：测试产物不该留在仓库里，
    # 也不该和生产/本地开发用的目录混在一起。
    upload-dir: ${java.io.tmpdir}/paideia-test-uploads
    cache:
      # 测试环境没有 Redis；显式关闭，缓存组件自动回退直读数据库。
      enabled: false
  ai:
    # 测试环境没有本地 Ollama；RAG 显式关闭，相关单测用桩注入 EmbeddingClient。
    embedding:
      enabled: false
    rag:
      enabled: false
    # 平台统一持有的上游凭据（WORK-009）。测试里**从不真的打到上游**——会话与精简都把端口/模型桩掉了；
    # 这里只需要"配置齐全"，好让"平台尚未配置"那条分支不被误触发（那条分支由用例临时清空它来验）。
    # 地址取 1.1.1.1：SSRF 校验只放行公网地址，写 localhost 会让上下文起不来。
    billing:
      enabled: true
      platform-credential:
        base-url: https://1.1.1.1/v1
        model: deepseek-flash
        api-key: test-only-platform-key-never-used
      # 价目表：每千 token 的积分。给一组好算的值，方便断言扣减（100/千 input、200/千 output）。
      pricing:
        deepseek-flash:
          input: 100
          output: 200
  mail:
    # 测试环境没有真实 SMTP：**显式**开启日志降级，否则装配层会让上下文起不来。
    # 测试取验证码靠 @Primary 的 InMemoryMailPort（见 AccountAuthTestSupport），这一项只为让装配通过。
    allow-log-fallback: true
  web:
    cors:
      # 测试里显式列出一个来源，用来验证白名单确实生效（桌面壳的固定渲染来源）
      allowed-origins:
        - http://127.0.0.1:5310

# Actuator 端点有自己的一套 CORS 配置，与上面那份不是同一个开关，两处都要配
management:
  endpoints:
    web:
      cors:
        allowed-origins:
          - http://127.0.0.1:5310
