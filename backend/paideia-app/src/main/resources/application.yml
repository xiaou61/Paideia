server:
  compression:
    # 前端产物实测：入口 chunk 942 KB、CSS 18 KB，服务器原来**一个字节都不压**（实测
    # Content-Encoding 缺失，Content-Length 就是原文件大小）。开着它同一份文件变 283 KB。
    # 只压超过 1 KB 的、且只压文本类——图片与字体已经是压缩格式，再压是白烧 CPU。
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/javascript
      - text/javascript
      - text/css
      - text/html
      - text/plain
      - application/json
      - application/xml
      - image/svg+xml

spring:
  application:
    name: paideia
  servlet:
    multipart:
      # 上限刻意比业务上限（10 MB）大一点：让"超过 10 MB"由业务校验给出可读的 400，
      # 而不是让容器在解析阶段就拒掉。真正超过 12 MB 才由 MaxUploadSizeExceededException 兜住。
      max-file-size: 12MB
      max-request-size: 12MB
  task:
    execution:
      # 助手流式回答的执行器（2026-10-19 压测后显式配置）。
      #
      # 默认值在这台 4 核机上实测的问题是**静默排队**：Boot 默认 core=8、队列无界
      # （max-size 实际是 Integer.MAX_VALUE），所以第 9 条流不会报错，只是整段等在队列里。
      # 20 并发时队列堆到 13，首事件中位数 9.7 秒、p95 19 秒，而服务端零错误——
      # 用户看到的是"助手半天不说话"，日志里什么也查不到。
      #
      # 为什么核心数给到 32：这些线程几乎全程在等上游流（AI 压测期间 Java 进程 CPU 接近 0），
      # 不是算力瓶颈，8 这个默认值是按 CPU 密集任务定的。
      # 为什么队列只有 8：队列是"安静地让人等"。超过约 40 条同时在飞之后，
      # 宁可立刻回 429 让人刷新重试，也不要让他等 20 秒才看到第一个字。
      thread-name-prefix: paideia-async-
      pool:
        core-size: 32
        max-size: 32
        queue-capacity: 8

paideia:
  ai:
    digest:
      # 每日技术速递（WORK-027）。**默认关闭**：它要访问多个外部站点、每天花一次 AI 调用。
      enabled: false
      # GitHub token：**强烈建议配置**。star 历史端点按 core 限额计费，
      # 带 token 5000/时；不带时匿名 60/时，候选池必须收缩。
      # 值只进被忽略的本地配置文件，仓库里只留环境变量占位。
      github-token: ${DIGEST_GITHUB_TOKEN:}
      # trending 页面基地址。生产机直连 github.com 会超时，配成本机反向代理地址
      # （例如 http://127.0.0.1:8082/trending）；默认值只给本地与测试用。
      github-trending-url: ${DIGEST_GITHUB_TRENDING_URL:https://github.com/trending}
      # 采集时刻（按 zone 解释）。08:00 北京 = 00:00 UTC，保证「昨天」是完整桶。
      cron: "${DIGEST_CRON:0 0 8 * * *}"
      # 成本闸：单次最多入库条数，也决定喂给 AI 的候选池上限。
      max-items-per-run: 60
      # 周报素材上限。
      weekly-max-items: 150
      # 抓多久以内（小时）。30 = 覆盖「昨天至今」并留容错，漏跑一次不丢内容。
      lookback-hours: 30
      # 单次 HTTP 抓取超时（秒）。
      timeout-seconds: 20
      # 一次 AI 压缩的超时（秒）。要处理几十条，给足。
      ai-timeout-seconds: 120
      # 内容直出（用户裁决 D-07）。
      publish-directly: true
      # 源清单在配置里而不是代码里：加一个 RSS 源不该改代码。
      rss:
        - key: qbitai
          name: 量子位
          url: https://www.qbitai.com/feed
          group: news
        - key: ithome
          name: IT之家
          url: https://www.ithome.com/rss/
          group: news
        - key: infoq
          name: InfoQ
          url: https://www.infoq.cn/feed
          group: news
        - key: juejin
          name: 掘金
          url: https://juejin.cn/rss
          group: community
        - key: oschina
          name: 开源中国
          url: https://www.oschina.net/news/rss
          group: community
    essay:
      # 八股文专区（WORK-025）。**默认关闭**：它要访问外部站点并消耗 AI 额度。
      enabled: false
      # 抓哪个面经合集：639 = Java 工程师（实测每天 3~7 条新帖）。
      job-id: 639
      # 回溯几天。默认 2 天 = 覆盖"昨天"并留一天容错，定时任务漏跑一次不会丢内容。
      lookback-days: 2
      # 每次最多翻几页（上游 pageSize 硬上限 20 条/页）。
      max-pages: 3
      # 抓来的内容进哪个分类。**不自动建分类**：不存在时任务跳过并记录。
      category-slug: essay-java
      # 抓来直接发布还是先进草稿。默认草稿——无人值守的自动入库，先让人过一眼更稳。
      publish-directly: false
      # 成本闸：单次最多解析多少题、最多处理多少帖。
      max-questions-per-run: 40
      max-posts-per-run: 10
    decision:
      # 决策模型（Laya，WORK-026）。**默认关闭**：它要连一个外部 Python 进程，
      # 那个进程不在就每次判定都要等超时。关掉时分类器直接返回"没判断出来"，
      # 调用方（面经技术内容过滤）自动退回规则判断，功能不受影响。
      enabled: false
      # laya-serve 地址。只应指向回环或内网——该服务除 api-key 外没有鉴权。
      base-url: http://127.0.0.1:8091
      # 与 laya-serve 的 LAYA_API_KEY 一致；留空表示对方没开鉴权。**值不进仓库**，部署时注入。
      api-key: ""
      # 延迟**随输入长度线性涨**（2026-10-21 在生产机实测，同一问题文本按长度复用）：
      # 810 字 1.1 秒 / 1620 字 2.9 秒 / 3240 字 3.8 秒 / 4000 字 4.0 秒。
      # 5 秒只给 4000 字留 1 秒余量，实际跑批已撞出两次 HttpTimeoutException（降级成规则）。
      # 8 秒 ≈ 实测最坏值的 2 倍。首次加载模型要 16~22 秒，那时的请求仍会超时降级——那是对的语义：
      # 不该为了等冷启动把每条内容都卡住。
      timeout-ms: 8000
      # 低于此值当作"模型没把握"，退回规则。配的是三分类的 softmax 概率
      # （实测技术面经能到 0.98）；**不是准确率**——中文未做温度拟合，官方自测 ECE 0.219。
      min-confidence: 0.7
      max-text-chars: 4000
    telemetry:
      # AI 调用统计（WORK-022）。**关掉不删历史数据**：只停止产生新记录，
      # 业务行为完全不变（采集端口换成空实现，埋点代码一字不改）。
      enabled: true
      # 成功轮次的保留比例。失败 / 超时 / 中断**永远保留**——采样是为了省存量，不是为了藏问题。
      sampling: 1.0
      # 保留天数。清理任务按它删，统计接口的时间窗也按它收敛。
      retention-days: 90
      # 有界队列容量。满则丢弃并计数，绝不阻塞调用方。
      queue-capacity: 10000
      # 停在 running 超过这么多小时的，清理任务标成 interrupted。
      stuck-after-hours: 6
      # 单次批处理条数上限。
      batch-size: 50
  web:
    cors:
      # 默认不放行任何跨域来源。需要时在此加入前端与桌面壳的来源；
      # 桌面壳来源不是 http(s) 域，必须显式列出，否则 exe 会因跨域调不通后端。
      allowed-origins: []
  mail:
    # 未配置 host 时**不会自动降级**：验证码写进日志等于注册后门，装配层会让应用直接启动失败。
    # 本地开发暂时不配 SMTP 时，取消下面这行的注释（仅限本地；他人可访问的环境必须配真实 SMTP）。
    # allow-log-fallback: true
  sandbox:
    # 代码执行（WORK-015）。**默认关闭**：执行用户代码是唯一一类"跑别人的程序"的能力，
    # 默认开等于把风险塞给每一个部署。打开需要本机有 Docker 且两个镜像已拉取。
    enabled: false
    # 留空 = Docker 默认 runtime（runc）。设成 runsc 即切到 gVisor（升级档）。
    runtime: ""
    # **这两个镜像是学习者代码的运行时基线**：课程里的可运行示例必须能在这里的版本上跑通。
    # `sql-image` 用 digest 钉住（它是本机构建的，没有上游 tag 可跟）；java/python 跟的是
    # 上游 tag，`docker pull` 会带来漂移——`scripts/verify_course.py` 会比对"本机跑示例的
    # 版本"与这里的基线，本机超前时提醒。改这里的版本要同步那个脚本的常量。
    java-image: eclipse-temurin:21-jdk-alpine
    python-image: python:3.12-alpine
    timeout-ms: 10000
    max-code-chars: 20000
    max-stdin-chars: 4000
    max-output-bytes: 65536
    max-concurrency: 2
    # WORK-038 从 50 提到 1000：实战关卡（调试/项目式）每题要跑多次，50 会和日常练习抢额度。
    # 真正的容量闸仍是每人并发 1；这个数字只当熔断器。
    daily-limit: 1000
    memory: 256m
    cpus: "0.5"
    pids-limit: 64
    # ── SQL 实训（WORK-032 TASK-001）─────────────────────────────────────────
    # 镜像由 `backend/paideia-sandbox/images/mysql/build.sh` 构建，**datadir 在构建期已初始化**。
    # 实测：初始化 17.9 s（所以不能运行时初始化）/ 启动到可查询 3.3 s / 常驻 348 MB。
    # 留空 = 该语言不可用：`/sandbox/status` 不返回 sql，前端也就不渲染运行按钮。
    sql-image: paideia-sandbox-mysql@sha256:e2eafb6ea161ddda420bde0f8d5ec3b0b03115811ea9507a23710034ef6d0a4f
    # SQL 的上限比 Java/Python 宽一档：mysqld 自身就要 350 MB 上下，256m 会被 OOM 杀掉。
    sql-memory: 512m
    sql-cpus: "1"
    # mysqld 是多线程的，64 不够（实测启动期就要几十个线程）。
    sql-pids-limit: 128
    # 20 s = 启动实测 3.3 s 的 6 倍余量（冷缓存、宿主机负载波动）。
    sql-timeout-ms: 20000
    # WORK-035 T-17 从 20 提到 500：SQL 跑在自己服务器上、不花 AI 积分，20 次没有成本依据，
    # 只是让人紧张。WORK-038 再提到 1000，与代码沙箱对齐——实战关卡要反复试错。
    # 真正的保护是 RunSlot 的**每人并发 1**；这个数字是熔断器（写脚本刷的天花板）。
    sql-daily-limit: 1000

management:
  # 运维监控（WORK-028）：多暴露一个 prometheus 端点给本机 Prometheus 抓取。
  # **为什么不另开管理端口**：实测依赖 8081 上 /actuator/health 的地方有六处
  # （管理端健康徽标、两端 e2e、两个 vite 代理、release.ps1），搬端口会一次性打断它们，
  # 收益（多一层网络隔离）远小于代价。改为在 SecurityConfiguration 里按来源 IP 放行：
  # 只有 127.0.0.1 能读 /actuator/**，health 仍公开（徽标与 e2e 要用）。
  # **触发重评**：一旦在本进程前面挂反向代理（nginx 等），远端地址会变成 127.0.0.1，
  # 这条白名单就失效——那时必须改回独立回环端口。
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  # WORK-042：诊断要读 HTTP P95，默认 Micrometer 只给 count/sum/max，没有 _bucket。
  # 只对 http.server.requests 开直方图，避免把全部指标都放大。
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # WORK-043 P2：trace 走 OTLP HTTP 到本机 Tempo；指标仍由 Prometheus 抓取，
  # 关闭 OTLP metrics 避免同一批指标走两套出口。
  tracing:
    enabled: true
    export:
      enabled: true
      otlp:
        enabled: true
    sampling:
      probability: ${PAIDEIA_TRACE_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: true
      endpoint: ${PAIDEIA_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
    metrics:
      export:
        enabled: false

logging:
  pattern:
    # 日志里带 trace id，Grafana 的 Loki derived field 才能跳到 Tempo。
    correlation: "[%X{traceId:-}] "