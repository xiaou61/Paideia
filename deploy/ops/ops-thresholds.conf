# 运维阈值单一来源（WORK-049）。
#
# 这里的三个值同时决定两处：
#   1. 应用摘要的判定（systemd 注入 PAIDEIA_OPS_THRESHOLDS_*，Spring 宽松绑定）；
#   2. Grafana 告警规则（install-ops.sh 渲染进 paideia-rules.yaml 的占位符）。
# 改完必须重跑 install-ops.sh 并重启 paideia 与 grafana-server，否则两侧会不一致。
#
# 约定：比例用 0~1 的小数；DISK_USED_ERROR 表示「已用比例」，规则里换算成「可用比例」。

DISK_USED_ERROR=0.85
UNIT_MEMORY_ERROR=0.90
BACKUP_STALE_HOURS=36
