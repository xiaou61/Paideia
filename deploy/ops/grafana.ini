# Grafana 主配置（WORK-028）。
#
# **只绑回环**：Grafana 的唯一入口是应用上 `hasRole("ADMIN")` 的反代路径
# `/api/v1/ops/grafana/**`。因此这里可以开匿名 Viewer——能到这条路径的人已经过管理员鉴权，
# 面板里不该再出现第二次登录。真正拦住外部访问的是"不监听公网"这件事本身。
[paths]
# **必须显式写**：不写时 Grafana 会去 <homepath>/data 建 sqlite，而 /usr 在
# ProtectSystem=strict 下是只读的，启动直接报 "read-only file system"（这里踩过）。
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000
# 反向代理会带来子路径前缀，Grafana 必须知道自己的根在哪，否则静态资源与 API 路径全错
root_url = http://127.0.0.1:3000/api/v1/ops/grafana/
serve_from_sub_path = true
# 管理端用同源 iframe 嵌入
allow_embedding = true

[security]
# **不开匿名**（2026-10-20 实测后改）：应用对反代前缀整体放行、由 Grafana 自己的会话把关。
# 不这样做的原因见 SecurityConfiguration 的规则注释：本项目无 Cookie、纯 Bearer，
# 而 Grafana 是 SPA，它需要一套**跨请求自动携带**的会话——那只能是 Cookie。
# 管理员在 iframe 里用 Grafana 口令登录一次，浏览器记住会话；
# 口令在 /etc/grafana/grafana.env（600，不进仓库）。
anonymous_enabled = false
cookie_secure = false
disable_initial_admin_creation = false

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console
level = info

[plugins]
# 2026-10-26 实测：Grafana 13.2.4 的后台安装器会把 bundled 的 Prometheus 插件从 13.2.3
# 升到 13.2.4；本单元是 ProtectSystem=strict，/usr/share 只读，升级失败后插件被注销，
# 五条 Prometheus 规则全部 "plugin.notRegistered"。升级前 13.2.3 插件 + 13.2.4 服务端
# 已正常运行，所以关掉自动升级/预装，保持随包版本。
preinstall_disabled = true
preinstall_auto_update = false
