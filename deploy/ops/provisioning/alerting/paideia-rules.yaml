# 六条告警（WORK-028 的四条 + WORK-042 的两条）。
#
# 为什么用 Grafana 而不是 Alertmanager：后者要多一个常驻进程与一套分组/抑制/静默配置，
# 而这里只需要"红了就发一封邮件"。升级触发条件：需要按标签分组去重、抑制、多接收端。
#
# **每条表达式都必须始终返回一个数值**（用 PromQL 的 `bool` 修饰符）：
# `x > 0.9` 在条件不成立时返回**空结果**，Grafana 会把它当成 NoData，
# 于是"一切正常"和"采集不到数据"在告警状态里长得一模一样——实测踩过：
# 四条规则里三条显示 nodata、剩下那条被我自己设成 NoData→Alerting 后平白 firing。
# `x > bool 0.9` 则始终返回 0 或 1，条件不成立就是 0，语义干净。
#
# 阈值与 application.yml 的 paideia.ops.thresholds 是两处，改一处要同步另一处。
apiVersion: 1

groups:
  - orgId: 1
    name: paideia-ops
    folder: Paideia
    interval: 1m
    rules:
      # 任何采集目标或探活目标掉线（含 laya / rustfs / firecrawl）
      - uid: paideia-target-down
        title: 采集目标下线
        condition: A
        for: 2m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              # 两侧用 `or vector(0)` 兜底：`up` 与 `probe_success` 的标签集不同，
              # 直接 `or` 在任一侧为空时不会互相补位，会让某些目标"看不见"。
              expr: >-
                (min(up) < bool 1) or (min(probe_success) < bool 1) or vector(0)
        noDataState: NoData
        execErrState: Error
        # **必须显式指定收件人**：Grafana 13 的 provisioned 规则不指定时，
        # `__grafana_receiver__` 会落到 `empty` 收件人——告警照样 firing、照样进历史，
        # 但**一封邮件都不发**。实测踩过：规则全部 ok、日志有 "Sending alerts to local
        # notifier"，却没有任何投递记录。
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 有采集目标或外部依赖下线
          description: 打开运维面板看「采集目标与外部依赖」表，up=0 的那一项就是它。

      # 磁盘可用低于 15%
      - uid: paideia-disk-low
        title: 磁盘可用低于 __DISK_FREE_PERCENT__%
        condition: A
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (node_filesystem_avail_bytes{mountpoint="/"}
                 / node_filesystem_size_bytes{mountpoint="/"}) < bool __DISK_FREE_RATIO__
        noDataState: NoData
        execErrState: Error
        # **必须显式指定收件人**：Grafana 13 的 provisioned 规则不指定时，
        # `__grafana_receiver__` 会落到 `empty` 收件人——告警照样 firing、照样进历史，
        # 但**一封邮件都不发**。实测踩过：规则全部 ok、日志有 "Sending alerts to local
        # notifier"，却没有任何投递记录。
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 磁盘可用不足 __DISK_FREE_PERCENT__%
          description: 现在最可能吃掉磁盘的是 Docker 镜像（8.35G 中 6.18G 可回收）。

      # 备份超过 36 小时没成功，或最近一次就是失败
      - uid: paideia-backup-stale
        title: 备份超过 __BACKUP_STALE_HOURS__ 小时未成功
        condition: A
        for: 10m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              # 两个条件取并集：太陈旧 或 上次失败。两者都用 bool，保证恒有值。
              expr: >-
                (paideia_backup_age_seconds > bool (__BACKUP_STALE_HOURS__ * 3600))
                or (paideia_backup_success < bool 1)
        noDataState: NoData
        execErrState: Error
        # **必须显式指定收件人**：Grafana 13 的 provisioned 规则不指定时，
        # `__grafana_receiver__` 会落到 `empty` 收件人——告警照样 firing、照样进历史，
        # 但**一封邮件都不发**。实测踩过：规则全部 ok、日志有 "Sending alerts to local
        # notifier"，却没有任何投递记录。
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 数据库备份已过期或失败
          description: 看 journalctl -u paideia-backup。没有备份时，一次误删就是全部内容没了。

      # Laya 内存超过上限 90%（OOM 后静默降级成规则判断）
      - uid: paideia-laya-memory
        title: Laya 内存超过上限 __UNIT_MEMORY_PERCENT__%
        condition: A
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia_unit_memory_bytes{unit="laya"}
                 / paideia_unit_memory_max_bytes{unit="laya"}) > bool __UNIT_MEMORY_RATIO__
        noDataState: NoData
        execErrState: Error
        # **必须显式指定收件人**：Grafana 13 的 provisioned 规则不指定时，
        # `__grafana_receiver__` 会落到 `empty` 收件人——告警照样 firing、照样进历史，
        # 但**一封邮件都不发**。实测踩过：规则全部 ok、日志有 "Sending alerts to local
        # notifier"，却没有任何投递记录。
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: Laya 内存贴近上限
          description: 2026-10-20 常态 85%。超过 90% 后 OOM 会静默降级成规则判断，功能还在但决策模型不在了。

      # 应用 5xx 比例超过 5%（WORK-042）。用 Prometheus 指标而不是日志，避免日志格式变化让规则失真。
      - uid: paideia-http-5xx
        title: HTTP 5xx 比例超过 5%
        condition: A
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              # 分子/分母都用 or vector(0) 兜底：没有请求时两者都是空集，整条会变空 → NoData
              # （2026-10-26 实测：Grafana 因此产生 DatasourceNoData 活动告警）。
              # bool 保证正常时返回 0 而不是空结果。
              expr: >-
                ((sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) or vector(0))
                 / clamp_min((sum(rate(http_server_requests_seconds_count[5m])) or vector(0)), 0.000001))
                > bool 0.05
        noDataState: NoData
        execErrState: Error
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 近 5 分钟 5xx 比例超过 5%
          description: 打开运维页的 AI 诊断区；诊断报告会带最近的 5xx 指标与 ERROR 日志。

      # 应用 ERROR 类日志突增（WORK-042）。
      # **NoData 当正常**：没有 error 日志时 count_over_time 返回空，这不等于采不到数。
      # 与指标规则相反，这里不能设 NoData→Alerting，否则一条错误都没有时反而一直告警。
      - uid: paideia-log-errors
        title: 应用 ERROR 日志突增
        condition: A
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: paideia-loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({unit="paideia.service"} |~ "(?i)(error|exception|failed)" [5m]))
                > 20
        noDataState: OK
        execErrState: Error
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 近 5 分钟应用 ERROR 类日志超过 20 条
          description: 打开运维页的日志面板与 AI 诊断区；诊断证据会带最近日志摘录。

      # 动态基线（WORK-043）：当前值显著高于上周同时段，且有绝对下限与样本门禁。
      # 读取 Prometheus 录制规则（deploy/ops/prometheus-rules.yml）；NoData=OK，
      # 录制规则尚未生效或样本不足时不误报。
      - uid: paideia-baseline-cpu
        title: CPU 相对 7 天基线异常
        condition: A
        for: 10m
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia:baseline_cpu:current > bool 70)
                * (paideia:baseline_cpu:samples7d > bool 100)
                * (((paideia:baseline_cpu:ratio > bool 2)
                    + ((paideia:baseline_cpu:z or vector(0)) > bool 3)) > bool 0)
        noDataState: OK
        execErrState: Error
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: CPU 高于 70% 且（超过 7 天同时段基线 2 倍或 z 大于 3）
          description: 打开运维页的 AI 诊断；诊断证据会带当前值、1h/24h/7d 基线、比值、z 与样本数。

      - uid: paideia-baseline-5xx
        title: 5xx 相对 7 天基线异常
        condition: A
        for: 10m
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia:baseline_5xx:current > bool 1)
                * (paideia:baseline_5xx:samples7d > bool 100)
                * (((paideia:baseline_5xx:ratio > bool 3)
                    + ((paideia:baseline_5xx:z or vector(0)) > bool 3)) > bool 0)
        noDataState: OK
        execErrState: Error
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 5xx 高于 1% 且（超过 7 天同时段基线 3 倍或 z 大于 3）
          description: 先用运维页 AI 诊断确认是否与最近发版有关；基线样本不足时不会触发。

      - uid: paideia-baseline-p95
        title: P95 相对 7 天基线异常
        condition: A
        for: 10m
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia:baseline_p95:current > bool 1)
                * (paideia:baseline_p95:samples7d > bool 100)
                * (((paideia:baseline_p95:ratio > bool 2)
                    + ((paideia:baseline_p95:z or vector(0)) > bool 3)) > bool 0)
        noDataState: OK
        execErrState: Error
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: P95 高于 1 秒且（超过 7 天同时段基线 2 倍或 z 大于 3）
          description: 打开运维页 AI 诊断；有链路后报告会带最慢 span。

      # 日志量基线：当前 5 分钟 ERROR 数 vs 上周同时段。B 无数据时 NoData=OK，
      # 不把「上周没有日志」当成异常；固定阈值规则（20 条/5m）仍然兜底。
      - uid: paideia-log-errors-baseline
        title: ERROR 日志相对上周同时段异常
        condition: C
        for: 10m
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({unit="paideia.service"} |~ "(?i)(error|exception|failed)" [5m]))
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-loki
            model:
              refId: B
              queryType: instant
              expr: >-
                sum(count_over_time({unit="paideia.service"} |~ "(?i)(error|exception|failed)" [5m] offset 1w))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: "$A > 3 * $B && $A > 10"
        noDataState: OK
        execErrState: Error
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: ERROR 日志超过上周同时段 3 倍且超过 10 条
          description: 上周同时段没有日志或 Loki 不可达时不触发；看运维页日志面板与 AI 诊断。

      # ── SLO 燃尽率（WORK-043 TASK-019）────────────────────────────────────
      #
      # 读 Prometheus 的 `paideia:slo_burn_rate:*`（prometheus-rules.yml）。
      # 多窗口同时超阈值才算触发，这是 Google SRE 的做法：长窗口保证"不是一次抖动"，
      # 短窗口保证"现在还没停"，两者都成立才叫快烧。
      #
      # **NoData=OK**：录制规则缺席（刚部署、没流量、没 AI 调用）时不能报警。
      # `*` 而不是 `and`：两侧各是 0/1，相乘即为"同时成立"。
      #
      # severity 只影响事件页的分类与 critical 抑制 warning 的行为，不影响谁收到邮件。
      - uid: paideia-slo-availability-fast
        title: SLO 快烧：HTTP 可用性
        condition: A
        for: 2m
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia:slo_burn_rate:http_availability_1h > bool 14.4)
                * (paideia:slo_burn_rate:http_availability_5m > bool 14.4)
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: HTTP 可用性正在以 14.4 倍速消耗月度预算
          description: 1 小时与 5 分钟同时快烧；1 小时内烧掉 2% 月度预算。看运维页事件与 AI 诊断，先查最近的 5xx、ERROR 日志与最慢/报错 trace。

      - uid: paideia-slo-availability-slow
        title: SLO 慢烧：HTTP 可用性
        condition: A
        for: 15m
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia:slo_burn_rate:http_availability_6h > bool 6)
                * (paideia:slo_burn_rate:http_availability_30m > bool 6)
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: HTTP 可用性持续以 6 倍速消耗预算
          description: 6 小时与 30 分钟同时慢烧；照这个速度一周左右烧完一个月的预算。不是急停级别，但今天该看一眼 5xx 的分布。

      - uid: paideia-slo-availability-budget
        title: SLO 预算告急：HTTP 可用性
        condition: A
        for: 1h
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia:slo_burn_rate:http_availability_3d > bool 1)
                * (paideia:slo_burn_rate:http_availability_6h > bool 1)
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: HTTP 可用性按 3 天速度会烧完月度预算
          description: 工单级告警：3 天与 6 小时燃尽率都大于 1。要么定一个可靠性改进项，要么把 99.5% 的目标按实际使用情况重新评估。

      - uid: paideia-slo-latency-slow
        title: SLO 慢烧：HTTP 延迟
        condition: A
        for: 15m
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia:slo_burn_rate:http_latency_6h > bool 6)
                * (paideia:slo_burn_rate:http_latency_30m > bool 6)
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: "HTTP 延迟（<984ms 占比 95%）持续慢烧"
          description: 看运维页 AI 诊断：证据里有 P95、7 天基线与最慢 span；先分清是应用变慢还是数据库/上游变慢。

      - uid: paideia-slo-ai-fast
        title: SLO 快烧：AI 成功率
        condition: A
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia:slo_burn_rate:ai_success_1h > bool 14.4)
                * (paideia:slo_burn_rate:ai_success_5m > bool 14.4)
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: AI 调用成功率正在快速下降
          description: 先看是不是上游凭据/额度/网络问题（诊断证据里的模型与错误类型），再看是不是本机积分或限流把请求挡在调上游之前。

      - uid: paideia-slo-login-fast
        title: SLO 快烧：登录成功率
        condition: A
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia:slo_burn_rate:login_success_1h > bool 14.4)
                * (paideia:slo_burn_rate:login_success_5m > bool 14.4)
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 登录成功率正在快速下降
          description: 先区分是"密码错/限流"（4xx，用户侧）还是"服务异常"（5xx）；诊断证据里的 5xx 与 ERROR 日志能分开这两类。

      # 定时任务不是 burn rate：它每天只跑一两次，用"最近一次是否成功"更直接。
      # 从未运行按成功算（ScheduledTaskMetrics 的约定），这里只抓"跑过且失败"。
      - uid: paideia-slo-scheduled-failing
        title: 定时任务最近一次失败
        condition: A
        for: 30m
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: paideia:sli_scheduled_success:ratio5m < bool 1
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 有定时任务上次执行失败（连续 30 分钟未恢复）
          description: 看运维页「定时任务」表定位是哪一个；再按手势清理/遥测保留/每日速递分别查日志。
