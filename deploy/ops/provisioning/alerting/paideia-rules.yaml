# 六条告警（WORK-028 的四条 + WORK-042 的两条）。
#
# 为什么用 Grafana 而不是 Alertmanager：后者要多一个常驻进程与一套分组/抑制/静默配置，
# 而这里只需要"红了就发一封邮件"。升级触发条件：需要按标签分组去重、抑制、多接收端。
#
# **每条表达式都必须始终返回一个数值**（用 PromQL 的 `bool` 修饰符）：
# `x > 0.9` 在条件不成立时返回**空结果**，Grafana 会把它当成 NoData，
# 于是"一切正常"和"采集不到数据"在告警状态里长得一模一样——实测踩过：
# 四条规则里三条显示 nodata、剩下那条被我自己设成 NoData→Alerting 后平白 firing。
# `x > bool 0.9` 则始终返回 0 或 1，条件不成立就是 0，语义干净。
#
# 阈值与 application.yml 的 paideia.ops.thresholds 是两处，改一处要同步另一处。
apiVersion: 1

groups:
  - orgId: 1
    name: paideia-ops
    folder: Paideia
    interval: 1m
    rules:
      # 任何采集目标或探活目标掉线（含 laya / rustfs / firecrawl）
      - uid: paideia-target-down
        title: 采集目标下线
        condition: A
        for: 2m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              # 两侧用 `or vector(0)` 兜底：`up` 与 `probe_success` 的标签集不同，
              # 直接 `or` 在任一侧为空时不会互相补位，会让某些目标"看不见"。
              expr: >-
                (min(up) < bool 1) or (min(probe_success) < bool 1) or vector(0)
        noDataState: NoData
        execErrState: Error
        # **必须显式指定收件人**：Grafana 13 的 provisioned 规则不指定时，
        # `__grafana_receiver__` 会落到 `empty` 收件人——告警照样 firing、照样进历史，
        # 但**一封邮件都不发**。实测踩过：规则全部 ok、日志有 "Sending alerts to local
        # notifier"，却没有任何投递记录。
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 有采集目标或外部依赖下线
          description: 打开运维面板看「采集目标与外部依赖」表，up=0 的那一项就是它。

      # 磁盘可用低于 15%
      - uid: paideia-disk-low
        title: 磁盘可用低于 15%
        condition: A
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (node_filesystem_avail_bytes{mountpoint="/"}
                 / node_filesystem_size_bytes{mountpoint="/"}) < bool 0.15
        noDataState: NoData
        execErrState: Error
        # **必须显式指定收件人**：Grafana 13 的 provisioned 规则不指定时，
        # `__grafana_receiver__` 会落到 `empty` 收件人——告警照样 firing、照样进历史，
        # 但**一封邮件都不发**。实测踩过：规则全部 ok、日志有 "Sending alerts to local
        # notifier"，却没有任何投递记录。
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 磁盘可用不足 15%
          description: 现在最可能吃掉磁盘的是 Docker 镜像（8.35G 中 6.18G 可回收）。

      # 备份超过 36 小时没成功，或最近一次就是失败
      - uid: paideia-backup-stale
        title: 备份超过 36 小时未成功
        condition: A
        for: 10m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              # 两个条件取并集：太陈旧 或 上次失败。两者都用 bool，保证恒有值。
              expr: >-
                (paideia_backup_age_seconds > bool (36 * 3600))
                or (paideia_backup_success < bool 1)
        noDataState: NoData
        execErrState: Error
        # **必须显式指定收件人**：Grafana 13 的 provisioned 规则不指定时，
        # `__grafana_receiver__` 会落到 `empty` 收件人——告警照样 firing、照样进历史，
        # 但**一封邮件都不发**。实测踩过：规则全部 ok、日志有 "Sending alerts to local
        # notifier"，却没有任何投递记录。
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 数据库备份已过期或失败
          description: 看 journalctl -u paideia-backup。没有备份时，一次误删就是全部内容没了。

      # Laya 内存超过上限 90%（OOM 后静默降级成规则判断）
      - uid: paideia-laya-memory
        title: Laya 内存超过上限 90%
        condition: A
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              expr: >-
                (paideia_unit_memory_bytes{unit="laya"}
                 / paideia_unit_memory_max_bytes{unit="laya"}) > bool 0.9
        noDataState: NoData
        execErrState: Error
        # **必须显式指定收件人**：Grafana 13 的 provisioned 规则不指定时，
        # `__grafana_receiver__` 会落到 `empty` 收件人——告警照样 firing、照样进历史，
        # 但**一封邮件都不发**。实测踩过：规则全部 ok、日志有 "Sending alerts to local
        # notifier"，却没有任何投递记录。
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: Laya 内存贴近上限
          description: 2026-10-20 常态 85%。超过 90% 后 OOM 会静默降级成规则判断，功能还在但决策模型不在了。

      # 应用 5xx 比例超过 5%（WORK-042）。用 Prometheus 指标而不是日志，避免日志格式变化让规则失真。
      - uid: paideia-http-5xx
        title: HTTP 5xx 比例超过 5%
        condition: A
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: paideia-prometheus
            model:
              refId: A
              instant: true
              intervalMs: 1000
              maxDataPoints: 1
              # clamp_min 防分母为 0；bool 保证正常时返回 0 而不是空结果。
              expr: >-
                (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                 / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.000001))
                > bool 0.05
        noDataState: NoData
        execErrState: Error
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 近 5 分钟 5xx 比例超过 5%
          description: 打开运维页的 AI 诊断区；诊断报告会带最近的 5xx 指标与 ERROR 日志。

      # 应用 ERROR 类日志突增（WORK-042）。
      # **NoData 当正常**：没有 error 日志时 count_over_time 返回空，这不等于采不到数。
      # 与指标规则相反，这里不能设 NoData→Alerting，否则一条错误都没有时反而一直告警。
      - uid: paideia-log-errors
        title: 应用 ERROR 日志突增
        condition: A
        for: 5m
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: paideia-loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum(count_over_time({unit="paideia.service"} |~ "(?i)(error|exception|failed)" [5m]))
                > 20
        noDataState: OK
        execErrState: Error
        notification_settings:
          receiver: paideia-ops
        annotations:
          summary: 近 5 分钟应用 ERROR 类日志超过 20 条
          description: 打开运维页的日志面板与 AI 诊断区；诊断证据会带最近日志摘录。
