# 基线录制规则的 promtool 用例（WORK-043）。
#
# 只测 CPU 这一组：它不依赖直方图/日志，能用合成 counter 精确覆盖
# 「正常 / 尖峰 / 样本不足」三种输入；5xx/P95 的表达式由 promtool check rules 保证语法，
# 运行时行为由 Grafana 规则 health 与生产查询确认。
#
# 间隔取 3 分钟：7 天窗口约 3360 个样本，低于 promtool 的单查询样本上限。
rule_files:
  - prometheus-rules.yml

evaluation_interval: 3m

tests:
  - name: cpu 正常，比值为 1
    interval: 3m
    input_series:
      - series: 'node_cpu_seconds_total{mode="idle",instance="test"}'
        values: '0+180x4'
    promql_expr_test:
      - expr: paideia:baseline_cpu:current
        eval_time: 12m
        exp_samples:
          - labels: '{__name__="paideia:baseline_cpu:current"}'
            value: 0

  - name: cpu 尖峰，当前 50%，上周同时段 0%，比值 50
    interval: 3m
    input_series:
      - series: 'node_cpu_seconds_total{mode="idle",instance="test"}'
        values: '0+180x3370 606600+90x10'
    promql_expr_test:
      - expr: paideia:baseline_cpu:current
        eval_time: 10140m
        exp_samples:
          - labels: '{__name__="paideia:baseline_cpu:current"}'
            value: 50
      - expr: paideia:baseline_cpu:ratio > bool 10
        eval_time: 10140m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: 样本不足时 samples7d 小于 100
    interval: 3m
    input_series:
      - series: 'node_cpu_seconds_total{mode="idle",instance="test"}'
        values: '0+180x10'
    promql_expr_test:
      - expr: paideia:baseline_cpu:samples7d
        eval_time: 30m
        exp_samples:
          - labels: '{__name__="paideia:baseline_cpu:samples7d"}'
            value: 10

  # ── z-score（WORK-049）─────────────────────────────────────────────────
  # 三种输入：稳态后尖峰（z>3）、长期一半时间高负载（绝对值大但 z 不显著）、
  # 完全无波动（分母下限生效，z=0 而不是 Inf/NaN）。

  - name: z-score：7 天稳态后的尖峰 |z|>3
    interval: 3m
    input_series:
      - series: 'node_cpu_seconds_total{mode="idle",instance="test"}'
        values: '0+180x3370 606600+90x10'
    promql_expr_test:
      - expr: paideia:baseline_cpu:z > bool 3
        eval_time: 10140m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: z-score：一半时间满载时绝对值大但 z 小于 3
    interval: 3m
    input_series:
      - series: 'node_cpu_seconds_total{mode="idle",instance="test"}'
        values: '0+180x1680 302400+0x1690'
    promql_expr_test:
      - expr: paideia:baseline_cpu:current > bool 99
        eval_time: 10110m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: paideia:baseline_cpu:z < bool 3
        eval_time: 10110m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: z-score：完全无波动时分母下限生效，z 为 0
    interval: 3m
    input_series:
      - series: 'node_cpu_seconds_total{mode="idle",instance="test"}'
        values: '0+90x3370'
    promql_expr_test:
      - expr: paideia:baseline_cpu:z
        eval_time: 10110m
        exp_samples:
          - labels: '{__name__="paideia:baseline_cpu:z"}'
            value: 0

  # ── SLO 录制规则（WORK-043 TASK-018）────────────────────────────────────
  # 只覆盖 HTTP 可用性/延迟这两组最容易算错的：4xx 排除、actuator 排除、无流量不算失败。
  # AI/登录的算式与可用性同构（good/total），由 promtool check rules 与生产查询确认。

  - name: 全部 200 时可用性为 1，燃尽率为 0
    interval: 3m
    input_series:
      - series: 'http_server_requests_seconds_count{status="200",uri="/api/v1/knowledge"}'
        values: '0+180x10'
    promql_expr_test:
      - expr: paideia:sli_http_availability:ratio5m > bool 0.999
        eval_time: 12m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: paideia:slo_burn_rate:http_availability_1h < bool 0.001
        eval_time: 12m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: 全部 500 时可用性为 0，1h 与 5m 同时快烧
    interval: 3m
    input_series:
      - series: 'http_server_requests_seconds_count{status="500",uri="/api/v1/knowledge"}'
        values: '0+180x10'
    promql_expr_test:
      - expr: paideia:sli_http_availability:ratio5m < bool 0.001
        eval_time: 27m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: paideia:slo_burn_rate:http_availability_1h > bool 14.4
        eval_time: 27m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: paideia:slo_burn_rate:http_availability_5m > bool 14.4
        eval_time: 27m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: 只有 4xx 与 actuator 流量时 SLI 为空，不会算成 0
    interval: 3m
    input_series:
      - series: 'http_server_requests_seconds_count{status="404",uri="/api/v1/missing"}'
        values: '0+180x10'
      - series: 'http_server_requests_seconds_count{status="200",uri="/actuator/prometheus"}'
        values: '0+180x10'
    promql_expr_test:
      - expr: absent(paideia:sli_http_availability:ratio5m)
        eval_time: 12m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: absent(paideia:slo_burn_rate:http_availability_5m)
        eval_time: 12m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: 一半请求超过 984ms 时延迟 SLI 为 0.5
    interval: 3m
    input_series:
      - series: 'http_server_requests_seconds_bucket{le="0.984263336",status="200",uri="/api/v1/knowledge"}'
        values: '0+180x10'
      - series: 'http_server_requests_seconds_count{status="200",uri="/api/v1/knowledge"}'
        values: '0+360x10'
    promql_expr_test:
      - expr: paideia:sli_http_latency:ratio5m > bool 0.4
        eval_time: 12m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: paideia:sli_http_latency:ratio5m < bool 0.6
        eval_time: 12m
        exp_samples:
          - labels: '{}'
            value: 1
