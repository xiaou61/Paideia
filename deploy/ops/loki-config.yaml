# Loki 单机配置（WORK-042）。
#
# 三条约束与其它监控单元一致：只绑回环、独立单元、有 MemoryMax。
# 文件系统存储 + tsdb 索引；保留 30 天，与 Prometheus 对齐。
# 不启用 ruler：告警由 Grafana 统一做，多一个 alertmanager 只会多一处要维护。

auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h
  # 超过 7 天的旧样本拒收：Alloy 正常只推新日志，出现旧时间戳说明时钟或缓冲异常。
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: 720h
  # 模板的指标聚合开关在 limits 里，不在 pattern_ingester.metric_aggregation 下（3.7.9）。
  # 显式写出来，避免默认值随版本变化时静默关掉 loki_patterns_* 指标。
  metric_aggregation_enabled: true
  pattern_persistence_enabled: true

compactor:
  working_directory: /var/lib/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m

# 日志模板（pattern ingester，WORK-085）。
# 用 Loki 内建的 Drain 聚类，把几十万行压成「模板 + 频次」，不再让模型直读原始日志。
# 3.7.9 的 aggregation.Config 只有 sample_period/loki_address/push_period/timeout 等字段，
# 没有 enabled，也没有 downsample_period（flag 名才是 -downsample-period）。
pattern_ingester:
  enabled: true
  metric_aggregation:
    loki_address: 127.0.0.1:3100

analytics:
  reporting_enabled: false
