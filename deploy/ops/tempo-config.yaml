# Tempo 单机配置（WORK-043 P2）。
#
# 只绑回环：应用通过 OTLP HTTP 4318 发 span，Grafana 通过 3200 查询。
# 文件系统存储 + 30 天保留，与 Prometheus/Loki 对齐；不启用 metrics-generator
# （SLO 用 Prometheus 现有指标，避免多一套聚合链路）。
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318
        grpc:
          endpoint: 127.0.0.1:4317

storage:
  trace:
    backend: local
    local:
      path: /var/lib/tempo/blocks
    wal:
      path: /var/lib/tempo/wal

# Tempo 3 的保留策略在 backend_worker（旧的顶层 compactor 已移除）。
# 单机模式下 worker 连本机 scheduler 的 gRPC 端口。
backend_worker:
  backend_scheduler_addr: 127.0.0.1:9095
  compaction:
    block_retention: 720h

# Tempo 3 的 live-store 默认往 /var/tempo 写 shutdown marker 与 WAL；
# 本单元 ProtectSystem=strict，必须显式改到可写目录。
live_store:
  shutdown_marker_dir: /var/lib/tempo
  wal:
    path: /var/lib/tempo/wal

usage_report:
  reporting_enabled: false
